<main id="main" class="receiver-main"><div class="receiver-heading"><p class="console-eyebrow">받은 자료 확인</p><h1>받은 확인 내역을<br>다시 확인해요.</h1><p>저장한 JSON을 가져오세요. 발급 서명과 원자료를 맞춰보고, 받은 내용이 확인 범위 안에 있는지 살펴봐요.</p></div>
